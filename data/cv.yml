profile:
  firstName: Constantin
  lastName: Petrov
  title:
    fr: Développeur Fullstack .NET / Angular / Vue.js
    en: Fullstack .NET / Angular / Vue.js Developer
    de: Fullstack-Entwickler .NET / Angular / Vue.js
  subtitle:
    fr: Applications métier, modernisation applicative et qualité logicielle
    en: Business applications, application modernization and software quality
    de: Geschäftsanwendungen, Anwendungsmodernisierung und Softwarequalität
  location: Belgique / Luxembourg
  links:
    linkedin: https://www.linkedin.com/in/c-petrov

summary:
  short:
    fr: Développeur Fullstack avec environ 5 ans d'expérience sur des applications métier au Luxembourg, principalement en contexte banque, CRM, paie et solutions internes.
    en: Fullstack developer with about 5 years of experience on business applications in Luxembourg, mainly in banking, CRM, payroll and internal solutions.
    de: Fullstack-Entwickler mit rund 5 Jahren Erfahrung in Geschäftsanwendungen in Luxemburg, vor allem in den Bereichen Banking, CRM, Lohnabrechnung und interne Lösungen.
  long:
    fr: Constantin intervient sur des environnements .NET modernes et legacy, du back-end C# aux interfaces Angular et Vue.js. Son approche privilégie la compréhension métier, la maintenabilité, les tests, le refactoring prudent et la modernisation progressive des systèmes existants.
    en: Constantin works across modern and legacy .NET environments, from C# back-end services to Angular and Vue.js interfaces. His approach focuses on business understanding, maintainability, testing, careful refactoring and progressive modernization of existing systems.
    de: Constantin arbeitet in modernen und bestehenden .NET-Umgebungen, von C#-Backend-Diensten bis zu Oberflächen mit Angular und Vue.js. Sein Ansatz legt Wert auf fachliches Verständnis, Wartbarkeit, Tests, vorsichtiges Refactoring und schrittweise Modernisierung bestehender Systeme.

