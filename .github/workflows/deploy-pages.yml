name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Node dependencies
        run: npm ci

      - name: Run .NET tests
        run: dotnet test tools/CvGenerator/CvGenerator.sln

      - name: Generate public CV data
        run: npm run cv:generate

      - name: Build public website
        run: npm run build

      - name: Run privacy checks
        run: npm run privacy:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/cv-web/dist

  deploy:
    name: Deploy public site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
